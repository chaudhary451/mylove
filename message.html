<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Message for You 💌</title>
  <meta name="description" content="An intimate love message, just for you.">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    .message-container { text-align: center; }

    /* ── Envelope ─────────────────────── */
    .envelope-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,79,163,0.2);
      border-radius: 20px;
      padding: 32px 20px;
      margin: 8px 0 24px;
      cursor: pointer;
      transition: all 0.35s cubic-bezier(0.4,0,0.2,1);
      position: relative;
      overflow: hidden;
    }
    .envelope-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% 0%, rgba(255,79,163,0.08) 0%, transparent 65%);
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .envelope-card:hover {
      border-color: rgba(255,79,163,0.45);
      background: rgba(255,79,163,0.06);
      transform: translateY(-4px);
      box-shadow: 0 16px 48px rgba(255,79,163,0.2);
    }
    .envelope-card:hover::before { opacity: 1; }

    .envelope-emoji {
      font-size: 4rem;
      display: block;
      margin: 0 0 12px;
      animation: floatEnvelope 3.2s ease-in-out infinite;
      filter: drop-shadow(0 0 20px rgba(255,79,163,0.5));
    }
    @keyframes floatEnvelope {
      0%, 100% { transform: translateY(0) rotate(-3deg); }
      50%       { transform: translateY(-12px) rotate(3deg); }
    }
    .envelope-card:hover .envelope-emoji {
      animation-play-state: paused;
      filter: drop-shadow(0 0 32px rgba(255,79,163,0.9));
    }

    .envelope-hint {
      font-size: 0.78rem;
      color: var(--text-muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 500;
      margin: 0;
    }
    .envelope-hint span {
      color: rgba(255,133,194,0.6);
    }

    /* ── Seal dot ─────────────────────── */
    .envelope-seal {
      width: 40px; height: 40px;
      background: linear-gradient(135deg, var(--pink-primary), #c9007a);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 4px;
      font-size: 1rem;
      box-shadow: 0 0 16px rgba(255,79,163,0.5);
      animation: sealPulse 2.5s ease-in-out infinite;
    }
    @keyframes sealPulse {
      0%, 100% { box-shadow: 0 0 16px rgba(255,79,163,0.5); }
      50%       { box-shadow: 0 0 32px rgba(255,79,163,0.8), 0 0 60px rgba(255,79,163,0.3); }
    }

    /* ── Message reveal card ────────────── */
    .message-reveal {
      display: none;
      animation: messageReveal 0.6s cubic-bezier(0.22,1,0.36,1) both;
    }
    .message-reveal.visible { display: block; }

    @keyframes messageReveal {
      0%   { opacity: 0; transform: scale(0.88) translateY(20px); }
      60%  { transform: scale(1.02) translateY(-4px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    .message-box {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,79,163,0.25);
      border-radius: 24px;
      padding: 40px 28px;
      position: relative;
      overflow: hidden;
      text-align: center;
    }
    .message-box::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 30% 0%, rgba(255,79,163,0.1) 0%, transparent 50%),
        radial-gradient(ellipse at 70% 100%, rgba(180,30,120,0.08) 0%, transparent 50%);
      pointer-events: none;
    }

    /* decorative top quote mark */
    .message-box::after {
      content: '\201C';
      position: absolute;
      top: -10px; left: 20px;
      font-size: 8rem;
      color: rgba(255,79,163,0.06);
      font-family: Georgia, serif;
      line-height: 1;
      pointer-events: none;
    }

    .message-text {
      font-size: 1.25rem;
      font-weight: 500;
      line-height: 1.75;
      color: var(--text-primary);
      position: relative;
      z-index: 1;
    }

    .message-text em {
      font-style: normal;
      color: var(--pink-soft);
      font-weight: 600;
    }

    .message-signature {
      margin-top: 20px;
      font-size: 0.85rem;
      color: var(--text-muted);
      font-style: italic;
      position: relative;
      z-index: 1;
    }
    .message-signature strong {
      color: var(--pink-secondary);
      font-style: normal;
    }

    .close-message-btn {
      position: absolute;
      top: 14px; right: 16px;
      width: 28px; height: 28px;
      border-radius: 50%;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      color: var(--text-muted);
      font-size: 1rem;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: all 0.25s ease;
      z-index: 2;
    }
    .close-message-btn:hover {
      background: rgba(255,79,163,0.15);
      border-color: rgba(255,79,163,0.3);
      color: var(--pink-primary);
    }

    /* ── Row of hearts ───────────────── */
    .hearts-row {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin: 16px 0 0;
      font-size: 1.2rem;
    }
    .hearts-row span {
      animation: heartPop 0.6s ease both, heartFloat 2.5s ease-in-out infinite;
      display: inline-block;
    }
    .hearts-row span:nth-child(1) { animation-delay: 0.05s, 0s; }
    .hearts-row span:nth-child(2) { animation-delay: 0.15s, 0.3s; }
    .hearts-row span:nth-child(3) { animation-delay: 0.25s, 0.6s; }
    @keyframes heartPop {
      0%   { transform: scale(0); opacity: 0; }
      70%  { transform: scale(1.25); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes heartFloat {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-5px); }
    }
  </style>
</head>
<body>

  <!-- Blobs -->
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <!-- Particles -->
  <div class="particles-container" id="particles"></div>

  <!-- Custom cursor -->
  <div class="cursor-dot" id="cursorDot"></div>
  <div class="cursor-ring" id="cursorRing"></div>

  <main class="container message-container page-enter">

    <div class="badge">
      <span class="badge-dot"></span>
      Just For You
    </div>

    <h1 class="glow-title">A Little Note 💌</h1>
    <p class="subtitle">Something I wanted you to know</p>

    <!-- Envelope trigger -->
    <div class="envelope-card" id="envelopeCard" onclick="openMessage()" role="button" tabindex="0" aria-label="Open love message" aria-expanded="false">
      <span class="envelope-seal">💌</span>
      <span class="envelope-emoji">💌</span>
      <p class="envelope-hint">Tap to open <span>your message</span></p>
    </div>

    <!-- Message reveal -->
    <div class="message-reveal" id="messageReveal" aria-hidden="true">
      <div class="message-box" id="loveMessage">
        <button class="close-message-btn" onclick="closeMessage()" aria-label="Close message">&times;</button>
        <p class="message-text">
          Hi, I love you so much <span class="heart-emoji">💖</span><br><br>
          You are the <em>best thing</em> that has ever happened to me. Every moment with you feels like magic, and I never want it to end. <span class="heart-emoji">🌸</span>
        </p>
        <p class="message-signature">— with all my heart, <strong>yours always</strong> 💗</p>
      </div>
      <div class="hearts-row" aria-hidden="true">
        <span>💕</span><span>💗</span><span>💖</span>
      </div>
    </div>

    <div class="divider"></div>

    <div class="nav-buttons">
      <button class="btn btn-ghost" onclick="navigateTo('recap.html')">← Back</button>
      <button class="btn btn-primary" onclick="navigateTo('thankyou.html')">Thank You →</button>
    </div>

  </main>

  <script src="script.js"></script>
  <script>
    // ── Custom cursor ──────────────────────────────────────
    const dot  = document.getElementById('cursorDot');
    const ring = document.getElementById('cursorRing');
    let mx = 0, my = 0, rx = 0, ry = 0;
    document.addEventListener('mousemove', e => {
      mx = e.clientX; my = e.clientY;
      dot.style.left = mx + 'px'; dot.style.top = my + 'px';
    });
    (function animRing() {
      rx += (mx - rx) * 0.12; ry += (my - ry) * 0.12;
      ring.style.left = rx + 'px'; ring.style.top = ry + 'px';
      requestAnimationFrame(animRing);
    })();
    document.querySelectorAll('button, .envelope-card').forEach(el => {
      el.addEventListener('mouseenter', () => document.body.classList.add('cursor-hover'));
      el.addEventListener('mouseleave', () => document.body.classList.remove('cursor-hover'));
    });

    // ── Particles ──────────────────────────────────────────
    const pContainer = document.getElementById('particles');
    const symbols = ['💗','✨','🌸','💕','💌','🌙','💖'];
    function spawnParticle() {
      const p = document.createElement('div');
      p.className = 'particle';
      p.textContent = symbols[Math.floor(Math.random() * symbols.length)];
      const size = 0.5 + Math.random() * 1;
      p.style.cssText = `left:${Math.random()*100}vw;font-size:${size}rem;animation-duration:${9+Math.random()*14}s;animation-delay:${Math.random()*3}s;`;
      pContainer.appendChild(p);
      setTimeout(() => p.remove(), 28000);
    }
    for (let i = 0; i < 12; i++) setTimeout(spawnParticle, i * 500);
    setInterval(spawnParticle, 2800);

    // ── Envelope keyboard support ──────────────────────────
    document.getElementById('envelopeCard').addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openMessage(); }
    });

    // ── Open / close message ───────────────────────────────
    function openMessage() {
      const card    = document.getElementById('envelopeCard');
      const reveal  = document.getElementById('messageReveal');

      card.style.display = 'none';
      reveal.classList.add('visible');
      reveal.setAttribute('aria-hidden', 'false');

      // Extra sparkle burst
      for (let i = 0; i < 8; i++) {
        setTimeout(() => {
          const s = document.createElement('div');
          s.className = 'particle';
          s.textContent = ['✨','💗','🌸','💖'][Math.floor(Math.random()*4)];
          s.style.cssText = `left:${30+Math.random()*40}vw;font-size:${0.8+Math.random()*0.8}rem;animation-duration:${3+Math.random()*3}s;animation-delay:0s;`;
          pContainer.appendChild(s);
          setTimeout(() => s.remove(), 7000);
        }, i * 80);
      }
    }

    function closeMessage() {
      const card   = document.getElementById('envelopeCard');
      const reveal = document.getElementById('messageReveal');
      reveal.classList.remove('visible');
      reveal.setAttribute('aria-hidden', 'true');
      card.style.display = '';
    }

    // expose globally for inline onclick in HTML
    window.openMessage  = openMessage;
    window.closeMessage = closeMessage;
  </script>
</body>
</html>
